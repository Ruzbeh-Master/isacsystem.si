<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title description">
  <title id="title">ISAC Systems introduction</title>
  <desc id="description">Measure what really matters. Beyond grades, beyond theory, real capability.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a2b" />
      <stop offset="1" stop-color="#030711" />
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#0e5470" stop-opacity=".45" />
      <stop offset="1" stop-color="#030711" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#background)" />
  <ellipse cx="930" cy="350" rx="420" ry="380" fill="url(#glow)" />
  <g fill="none" stroke="#21bde8" stroke-opacity=".22">
    <circle cx="930" cy="350" r="265" />
    <circle cx="930" cy="350" r="205" stroke-dasharray="5 10" />
    <circle cx="930" cy="350" r="145" />
  </g>
  <circle cx="1125" cy="195" r="7" fill="#28c6ef" />
  <text x="100" y="145" fill="#8fa9bd" font-family="Arial,sans-serif" font-size="18" letter-spacing="5">ISAC SYSTEMS · CAPABILITY INTELLIGENCE</text>
  <text x="100" y="330" fill="#f1f7ff" font-family="Arial,sans-serif" font-size="96" font-weight="700" letter-spacing="-5">Measure what</text>
  <text x="100" y="440" fill="#f1f7ff" font-family="Arial,sans-serif" font-size="96" font-weight="700" letter-spacing="-5">really <tspan fill="#21bde8">matters.</tspan></text>
  <text x="104" y="510" fill="#b2c1cf" font-family="Arial,sans-serif" font-size="27">Beyond grades. Beyond theory. Real capability.</text>
</svg>
